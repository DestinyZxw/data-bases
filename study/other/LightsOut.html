<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Lights Out - 自定义与随机模式</title>
<style>
  body {font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; display:flex; flex-direction:column; align-items:center; padding:24px;}
  h1 {margin:0 0 12px;}
  #board {display:grid; gap:6px; margin:16px 0;}
  .cell {width:56px; height:56px; display:flex; align-items:center; justify-content:center; cursor:pointer; user-select:none; border-radius:6px; box-shadow:0 1px 2px rgba(0,0,0,0.15);}
  .on {background: #ffd54f; color:#222;}
  .off {background: #263238; color:#fff;}
  .pressed {outline:3px solid rgba(0,150,136,0.35);}
  .controls {display:flex; gap:8px; flex-wrap:wrap;}
  button, select {padding:8px 12px; border-radius:6px; border:1px solid #ccc; background:#fff; cursor:pointer;}
  #msg {margin-top:12px; min-height:1.2em;}
  small {color:#666;}
</style>
</head>
<body>

<h1>Lights Out</h1>
<div class="controls">
  <button id="randomBtn">随机布局</button>
  <button id="resetBtn">重置（全开）</button>
  <button id="solveBtn">求解</button>
  <button id="applyBtn">应用解</button>
  <label><small>网格：</small>
    <select id="sizeSelect">
      <option value="5" selected>5 × 5</option>
      <option value="3">3 × 3</option>
      <option value="4">4 × 4</option>
      <option value="6">6 × 6</option>
    </select>
  </label>
  <label><small>布局模式：</small>
    <select id="modeSelect">
      <option value="random" selected>随机布局</option>
      <option value="custom">自定义布局</option>
    </select>
  </label>
  <button id="lockBtn" style="display:none;">开始游戏</button>
</div>

<div id="board"></div>
<div id="msg"></div>

<script>
const boardEl = document.getElementById('board');
const randomBtn = document.getElementById('randomBtn');
const resetBtn = document.getElementById('resetBtn');
const solveBtn = document.getElementById('solveBtn');
const applyBtn = document.getElementById('applyBtn');
const msg = document.getElementById('msg');
const sizeSelect = document.getElementById('sizeSelect');
const modeSelect = document.getElementById('modeSelect');
const lockBtn = document.getElementById('lockBtn');

let size = parseInt(sizeSelect.value, 10);
let mode = modeSelect.value; // "random" or "custom"
let customLocked = false;    // 自定义模式是否锁定
let cells = []; // true=on
let solution = null;

modeSelect.addEventListener('change', () => {
  mode = modeSelect.value;
  if (mode === 'custom') {
    customLocked = false;
    lockBtn.textContent = '开始游戏';
    lockBtn.style.display = 'inline-block';
    setMsg('自定义模式：先编辑布局，再点击“开始游戏”锁定');
  } else {
    lockBtn.style.display = 'none';
    setMsg('随机模式');
  }
  initGrid(size);
});

lockBtn.addEventListener('click', () => {
  customLocked = !customLocked;
  if (customLocked) {
    lockBtn.textContent = '重新编辑';
    setMsg('已锁定布局，现在是正式游戏阶段');
  } else {
    lockBtn.textContent = '开始游戏';
    setMsg('回到编辑模式，可自由调整灯光状态');
  }
});

function initGrid(n) {
  size = n;
  boardEl.style.gridTemplateColumns = `repeat(${n}, auto)`;
  boardEl.innerHTML = '';
  if (mode === 'custom') {
    cells = new Array(n * n).fill(false); // 全灭
  } else {
    cells = new Array(n * n).fill(true);  // 全亮后随机化
  }

  for (let i = 0; i < n * n; i++) {
    const div = document.createElement('div');
    div.className = 'cell on';
    div.dataset.idx = i;
    div.addEventListener('click', () => {
      if (mode === 'custom') {
        if (!customLocked) {
          cells[i] = !cells[i]; // 编辑模式
        } else {
          pressCell(i); // 游戏模式
        }
      } else {
        pressCell(i); // 随机模式直接玩
      }
      render();
      solution = null;
      setMsg('');
    });
    boardEl.appendChild(div);
  }

  if (mode === 'random') randomize();
  render();
  solution = null;
}

function idxToRC(i) { return [Math.floor(i / size), i % size]; }
function rcToIdx(r,c){ return r*size + c; }
function inBounds(r,c){ return r>=0 && r<size && c>=0 && c<size; }

function toggleAt(i) {
  const [r,c] = idxToRC(i);
  const pts = [[r,c],[r-1,c],[r+1,c],[r,c-1],[r,c+1]];
  for (const [rr,cc] of pts) {
    if (inBounds(rr,cc)) {
      const j = rcToIdx(rr,cc);
      cells[j] = !cells[j];
    }
  }
}

function pressCell(i){ toggleAt(i); }

function render(highlightMoves=null) {
  const childs = boardEl.children;
  for (let i=0;i<childs.length;i++){
    const el = childs[i];
    el.classList.toggle('on', !!cells[i]);
    el.classList.toggle('off', !cells[i]);
    el.classList.toggle('pressed', highlightMoves && highlightMoves[i]);
    el.textContent = i;
  }
}

function setMsg(s){ msg.textContent = s; }

function randomize(){
  for (let i=0;i<cells.length;i++){
    cells[i] = Math.random() < 0.5;
  }
  render();
  solution = null;
  setMsg('已随机生成布局');
}

function resetAllOn(){
  for (let i=0;i<cells.length;i++) cells[i] = true;
  render();
  solution = null;
  setMsg('已重置为全部点亮');
}

function solveGF2() {
  const N = size * size;
  const mat = Array.from({length: N}, (_, i) => {
    const row = new Array(N+1).fill(0);
    const [r,c] = idxToRC(i);
    const neighbors = [[r,c],[r-1,c],[r+1,c],[r,c-1],[r,c+1]];
    for (const [rr,cc] of neighbors) {
      if (inBounds(rr,cc)) {
        const j = rcToIdx(rr,cc);
        row[j] = 1;
      }
    }
    row[N] = cells[i] ? 1 : 0;
    return row;
  });

  let rank = 0;
  const where = new Array(N).fill(-1);
  for (let col=0; col<N && rank<N; col++){
    let sel = -1;
    for (let row=rank; row<N; row++){
      if (mat[row][col] === 1) { sel = row; break; }
    }
    if (sel === -1) continue;
    [mat[rank], mat[sel]] = [mat[sel], mat[rank]];
    where[col] = rank;
    for (let row=0; row<N; row++){
      if (row !== rank && mat[row][col] === 1) {
        for (let c=col; c<=N; c++){
          mat[row][c] ^= mat[rank][c];
        }
      }
    }
    rank++;
  }

  for (let row=rank; row<N; row++){
    let allzero = true;
    for (let c=0;c<N;c++) if (mat[row][c]) { allzero = false; break; }
    if (allzero && mat[row][N] === 1) {
      return { solvable:false, solution:null };
    }
  }

  const x = new Array(N).fill(0);
  for (let i=0;i<N;i++){
    if (where[i] !== -1) {
      x[i] = mat[where[i]][N];
    } else {
      x[i] = 0;
    }
  }
  return { solvable:true, solution:x };
}

function applySolution(sol){
  if (!sol) return;
  const moves = [];
  for (let i=0;i<sol.length;i++){
    if (sol[i]) {
      toggleAt(i);
      moves.push(i);
    }
  }
  render();
  setMsg(`已应用 ${moves.length} 次按键：${moves.join(', ')}`);
}

randomBtn.addEventListener('click', () => {
  if (mode === 'custom') {
    setMsg('当前为自定义模式，随机布局仅在随机模式下有效');
  } else {
    randomize();
  }
});
resetBtn.addEventListener('click', () => { resetAllOn(); });
solveBtn.addEventListener('click', () => {
  const res = solveGF2();
  if (!res.solvable) {
    solution = null;
    setMsg('无解');
    render();
  } else {
    solution = res.solution;
    const highlight = solution.map(v => !!v);
    render(highlight);
    const count = solution.reduce((s,v)=>s+v,0);
    setMsg(`找到解：需要按 ${count} 次（高亮显示）`);
  }
});
applyBtn.addEventListener('click', () => {
  if (!solution) { setMsg('当前没有解'); return; }
  applySolution(solution);
  solution = null;
});

sizeSelect.addEventListener('change', () => {
  const n = parseInt(sizeSelect.value, 10);
  initGrid(n);
});

initGrid(size);

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    if (mode === 'random') randomize();
  } else if (e.key.toLowerCase() === 's') {
    solveBtn.click();
  }
});
</script>

</body>
</html>
